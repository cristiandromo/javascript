<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <script src="assets/scriptfunciones.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 30px 20px;
        font-family: 'Segoe UI', Arial, sans-serif;
        color: #1a1a1a;
        background: #f2f1ec;
      }

      header {
        max-width: 1100px;
        margin: 0 auto 20px;
      }

      header h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      header p {
        margin: 4px 0 0;
        font-size: 0.85rem;
        color: #6b6b6b;
      }

      .paneles {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        max-width: 1100px;
        margin: 0 auto;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        background: #ffffff;
        border: 1px solid #d9d6ce;
        border-radius: 6px;
      }

      .panel h2 {
        margin: 0;
        font-size: 1rem;
      }

      .campo {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      label {
        font-size: 0.75rem;
        color: #555555;
      }

      input {
        width: 100%;
        padding: 8px 10px;
        font-family: inherit;
        font-size: 0.9rem;
        border: 1px solid #cccccc;
        border-radius: 4px;
      }

      input:focus {
        outline: none;
        border-color: #e8a317;
      }

      input[readonly] {
        background: #fdf6e3;
        font-weight: 600;
      }

      .botones {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      button {
        padding: 8px;
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e8a317;
        background: #141414;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        color: #141414;
        background: #e8a317;
      }

      .full {
        grid-column: 1 / -1;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Calculadora</h1>
    </header>

    <main class="paneles">
      <section class="panel">
        <h2>Panel 1 · Números</h2>

        <div class="campo">
          <label for="num1">Primer número</label>
          <input type="number" id="num1" placeholder="Primer número" />
        </div>

        <div class="campo">
          <label for="num2">Segundo número</label>
          <input type="number" id="num2" placeholder="Segundo número" />
        </div>

        <div class="botones">
          <button type="button" onclick="sumar()">Sumar</button>
          <button type="button" onclick="restar()">Restar</button>
          <button type="button" onclick="multiplicar()">Multiplicar</button>
          <button type="button" onclick="dividir()">Dividir</button>
          <button type="button" onclick="raiz()">Raíz</button>
          <button type="button" onclick="multiplo()">Múltiplo</button>
          <button type="button" class="full" onclick="compara()">Comparar</button>
        </div>

        <div class="campo">
          <label for="resultado">Resultado</label>
          <input type="text" id="resultado" placeholder="Resultado" readonly />
        </div>
      </section>

      <section class="panel">
        <h2>Panel 2 · Texto</h2>

        <div class="campo">
          <label for="campocadena1">Cadena 1</label>
          <input type="text" id="campocadena1" placeholder="Primera cadena" />
        </div>

        <div class="campo">
          <label for="campocadena2">Cadena 2 / carácter</label>
          <input type="text" id="campocadena2" placeholder="Segunda cadena o carácter" />
        </div>

        <div class="botones">
          <button type="button" onclick="comparar_cadenas()">Comparar</button>
          <button type="button" onclick="contarcaracter()">Contar</button>
          <button type="button" onclick="espacios()">Espacios</button>
          <button type="button" onclick="insertar()">Insertar</button>
        </div>

        <div class="campo">
          <label for="camporesultado">Resultado</label>
          <input type="text" id="camporesultado" placeholder="Resultado" readonly />
        </div>
      </section>

      <section class="panel">
        <h2>Panel 3 · Vectores</h2>

        <div class="campo">
          <label for="vectorInput">Números separados por coma</label>
          <input type="text" id="vectorInput" placeholder="Ej: 1,2,3,4" />
        </div>

        <div class="botones">
          <button type="button" onclick="crearVector()">Crear</button>
          <button type="button" onclick="sumarVector()">Sumar</button>
          <button type="button" class="full" onclick="pares()">Pares</button>
        </div>

        <div class="campo">
          <label for="resultadoVector">Resultado</label>
          <input type="text" id="resultadoVector" placeholder="Resultado" readonly />
        </div>
      </section>
    </main>
  </body>
</html>
