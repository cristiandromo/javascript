<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let jugador = parseInt(prompt('1 piedra, 2 papel, 3 tijera'));
      let pc = Math.floor(Math.random() * 3) + 1;
      console.log(pc);

      switch (jugador + '-' + pc) {
        case '1-1':
        case '2-2':
        case '3-3':
          console.log('Empate');
          break;
        case '1-3':
        case '2-1':
        case '3-2':
          console.log('Ganaste');
          break;
        case '1-2':
        case '2-3':
        case '3-1':
          console.log('Perdiste');
          break;
        default:
          console.log('Opcion no valida');
      }
    </script>
  </body>
</html>
