<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let mes = parseInt(prompt('ingrese un numero del 1 al 3'));
      switch (mes) {
        case 1:
          console.log('enero');
          break;
        case 2:
          console.log('febrero');
          break;
        case 3:
          console.log('marzo');
          break;
        default:
          console.log('mes no valido');
      }
    </script>
  </body>
</html>
